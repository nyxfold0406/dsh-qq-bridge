# 完整配置示例 —— 复制成 cordis.patch.yml 再按自己情况改。
#
# 只填自己用得上的；没写的键都会回落到 src/config.js 里的 DEFAULTS（深合并）。
# 所有「你自己的东西」都只应该出现在这个文件里，不要写进代码。

- insert:
    - id: qq
      name: '@nyxfold/dsh-qq-bridge'
      config:
        # ── NapCat（OneBot v11）───────────────────────────────────────────
        napcatUrl: 'http://127.0.0.1:3000'
        # 本插件的入站端口；NapCat 的 HTTP 上报要指向 http://127.0.0.1:6721/
        listenPort: 6721
        # 只有这些号码能跟桥说话。留空 = 谁都不理（不是全放行）。
        allowUins:
          - '1000000001'
        # 入站令牌（强烈建议设置）：设了就要求 NapCat 的 post_url 写成
        #   http://127.0.0.1:6721/<这个值>
        # 防止本机别的程序、或浏览器里的网页冒充你往桥里塞消息。
        # ingressToken: 'change-me-to-a-random-string'

        # ── 数据与路径 ───────────────────────────────────────────────────
        # state.json / bridge.log / 截图都放这里
        dataDir: 'C:\Users\you\.dsh\qq'
        # qq_workspaces / qq_call_workspace 扫描的根目录
        # workspacesRoot: 'C:\Users\you\AGENTS'
        # Lily 总机的工作目录名（放在 workspacesRoot 下）
        # switchboardDir: 'Switchboard'

        # ── 语音转文字（可选）───────────────────────────────────────────
        # pythonPath: 'python'          # 装了 faster-whisper 的解释器
        # sttScript: 'tools/stt.py'
        # sttModel: 'small'

        # ── 行为 ─────────────────────────────────────────────────────────
        # maxChars: 600                 # 单条消息上限，超了自动分段（下限 200）
        # intakeImages: true            # 收图给会话看
        # remoteHint: true              # 每条消息前提醒「他在手机上」
        # logLevel: 'info'              # debug / info / warn / error

        # ── 群聊（可选）──────────────────────────────────────────────────
        group:
          enabled: false
          allowGroups:
            - '1000000002'
          # 群里用哪个模型答：cloud:<名字> 走下面 cloud，普通名字走 baseUrl
          model: 'cloud:deepseek-flash'
          # true = 只有 @ 或 wakeWords 才回；false = 每句都回（受限流）
          requireMention: true
          wakeWords: []
          maxPerMinute: 4
          maxChars: 160
          history: 5
          # 人设与事实：这里放你自己的，不要写别人的
          systemPrompt: ''
          persona: ''
          facts: []
          # 表情库（可选）
          # stickersDir: 'C:\Users\you\.dsh\qq\stickers'
          # stickersInbox: 'C:\Users\you\.dsh\qq\stickers-inbox'
          cloud:
            enabled: true
            baseUrl: 'https://api.deepseek.com/v1'
            # 存 API Key 的文件路径（别把 key 写进这个 yml）
            keyFile: 'C:\Users\you\.dsh\qq\deepseek.key'
            models:
              - 'deepseek-flash'
            disableThinking: true
