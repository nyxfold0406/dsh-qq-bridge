# Bundle layer: mount the QQ bridge (src/bridge.js) into DSH.
#
# This is the shipped default: it starts the bridge with NOBODY allowed to talk
# to it (allowUins is empty) and group chat off. Fill in your own values in the
# DSH profile, or copy ../cordis.patch.example.yml over this file.
#
#   outbound API  -> config.napcatUrl   (NapCat's HTTP server, default 127.0.0.1:3000)
#   inbound events <- config.listenPort (this plugin's own loopback listener)
#
# Set NapCat's HTTP 上报 (post_url) to http://127.0.0.1:<listenPort>/ so private
# messages reach the bridge. Only allowUins may talk to it.
- insert:
    - id: qq
      name: '@nyxfold/dsh-qq-bridge'
      config:
        napcatUrl: 'http://127.0.0.1:3000'
        listenPort: 6721
        allowUins: []
        group:
          enabled: false
